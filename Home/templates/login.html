{% extends 'base.html' %}
{% block title %} Login {% endblock %}
{% block script %}
<script>

</script>
{% endblock %}
{% block style %}
<style>
    .divider:after,
    .divider:before {
    content: "";
    flex: 1;
    height: 1px;
    background: #eee;
    }
    .h-custom {
    height: calc(100% - 73px);
    }
    @media (max-width: 450px) {
    .h-custom {
    height: 100%;
    }
    }
</style>
{% endblock %}

{% block content %}
<section class="vh-100">
  <div class="container-fluid h-custom p-5">
    <div class="row d-flex justify-content-center align-items-center h-100" style="background-color:beige; border-radius: 50px" >
      <div class="col-md-9 col-lg-6 col-xl-5">
        <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.webp"
          class="img-fluid" alt="Sample image">
      </div>
      <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
        {%if error%}
        <div class="alert alert-danger" role="alert">
          {{error}}
        </div>
        {%endif%}
        <form action="." method="POST">
          {% csrf_token %}
          <div class="divider d-flex align-items-center my-4">
            <p class="text-center fw-bold mx-3 mb-0">Sign in</p>
          </div>

          <div class="form-outline mb-4">
            <input required type="text" Name='token' id="form3Example3" class="form-control form-control-lg" style="background-color: #ffffff;"/>
            <label class="form-label" for="form3Example3">Access Token</label>
          </div>

          <div class="text-center text-lg-start mt-4 pt-2">
            <button type="submit" class="btn btn-primary btn-lg"
              style="padding-left: 2.5rem; padding-right: 2.5rem;">Login</button>
          </div>

        </form>
      </div>
    </div>
  </div>
  
</section>
{% endblock %}
