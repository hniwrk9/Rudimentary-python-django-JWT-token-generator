<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <!-- Font Awesome -->
    <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
    href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
    rel="stylesheet"
    />
    <!-- MDB -->
    <link
    href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.css"
    rel="stylesheet"
    />
    <!-- MDB -->
    <script
    type="text/javascript"
    src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.js"
    ></script>
    {% block script %}{% endblock %} 
    {% block style %}{% endblock %} 
    <title>{% block title %}{% endblock %}</title>
    <style>
      .navbar{
        position: fixed;
        z-index: 100;
        width: 100%;
      }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark  bg-body-tertiary" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand"  disabled hidden></a>
          <button class="navbar-toggler" disabled hidden type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0" >
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" hidden  disabled>Button 1</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" hidden diabled >Button 2</a>
              </li>
            </ul>

            <div style="margin-left: 2rem">
                <a href="/ntoken" type="button" class="btn btn-primary">Generate Token</a>
            </div>
            <div style="margin-left: 2rem">
                <a href="/login" type="button" class="btn btn-primary">Login</a>
            </div>
          </div>
      </div>
    </nav>
    <div style="padding: 20px;"><p></p></div>
    {% block content %}

    {% endblock %}

    <footer style="margin-top: 2rem; background-color: black; padding-bottom: 1px;">
      <div class="container bg-dark  bg-body-tertiary" data-bs-theme="dark" style="z-index: 100; color: white;">
        <h1>This is the Footer</h1>
      </div>
    </footer>



    <script>


      // Icon Example
      const passwordInput1 = document.getElementById('show-password-input-1');
      const toggleIcon = document.getElementById('show-password-toggle-icon');

      toggleIcon.addEventListener('pointerdown', (e) => {
          e.preventDefault();

          // Toggle input type between password and text
          if (passwordInput1.type === 'password') {
            passwordInput1.type = 'text';
            toggleIcon.classList.remove('fa-eye');
            toggleIcon.classList.add('fa-eye-slash');
          } else {
            passwordInput1.type = 'password';
            toggleIcon.classList.remove('fa-eye-slash');
            toggleIcon.classList.add('fa-eye');
          }
        });

        
      const passwordInput2 = document.getElementById('show-password-input-2');
      const retoggleIcon = document.getElementById('show-repassword-toggle-icon');

        retoggleIcon.addEventListener('pointerdown', (e) => {
          e.preventDefault();

          // Toggle input type between password and text
          if (passwordInput2.type === 'password') {
            passwordInput2.type = 'text';
            retoggleIcon.classList.remove('fa-eye');
            retoggleIcon.classList.add('fa-eye-slash');
          } else {
            passwordInput2.type = 'password';
            retoggleIcon.classList.remove('fa-eye-slash');
            retoggleIcon.classList.add('fa-eye');
          }
        });

    </script>

</body>
</html>
