{% extends 'tbase.html' %}
{% block title %} Register {% endblock %}
{% block script %}
<script>

</script>
{% endblock %}
{% block style %}
<style>

</style>
{% endblock %}
{% block content %}

<section style="margin-top: 5rem; margin-bottom: 10rem;" class="vh-1" style="background-color: #eee;">
    <div class="container h-100">
      <div class="row d-flex justify-content-center align-items-center h-1">
        <div class="col-lg-12 col-xl-11">
          <div class="card text-black" style="border-radius: 25px; align-self: center; background-color:beige;">
            <div class="card-body p-md-5">
              <div class="row justify-content-center">
                <div class="col-md-10 col-lg-6 col-xl-6 order-2 order-lg-1">
  
                  <p class="text-center h1 fw-bold mb-5 mx-1 mx-md-4 mt-4">Enter Your Credentials</p>
                  
                  {%if error%}
                  <div class="alert alert-danger" role="alert">
                    {{error}}
                  </div>
                  {%endif%}
                  

                  <form class="mx-1 mx-md-4" action="." method="POST">
                    {% csrf_token %}

                    <div class="d-flex flex-row align-items-center mb-4">
                        <i class="fas fa-envelope fa-lg me-3 fa-fw"></i>
                        <div class="form-outline flex-fill mb-0">
                          <input required type="email" id="form3Example3c" class="form-control" style="background-color: #ffffff;" Name='email' value="{{email}}" />
                          <label class="form-label" for="form3Example3c">Email</label>
                        </div>
                      </div>
                      
                      <div class="d-flex flex-row align-items-center mb-4">
                        <i class="fas fa-lock fa-lg me-3 fa-fw"></i>
                        <div class="form-outline flex-fill mb-0" data-mdb-input-init>
                          <i class="far fa-eye trailing fa-fw pe-auto" id="show-password-toggle-icon"></i>
                          <input required type="password" id="show-password-input-1" class="form-control form-icon-trailing" style="background-color: #ffffff;" Name='password' />
                          <label class="form-label" for="show-password-input-1">Password</label>
                        </div>
                      </div>
  
                    <div class="d-flex justify-content-center mx-4 mb-3 mb-lg-4">
                      <button type="submit" class="btn btn-primary btn-lg">Generate New Token</button>
                    </div>
  
                  </form>
  
                </div>

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
</section>

{% endblock %}
