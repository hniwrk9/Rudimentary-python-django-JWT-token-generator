{% extends 'rbase.html' %}
{% block title %} Register {% endblock %}
{% block script %}
<script>

</script>
{% endblock %}
{% block style %}
<style>

</style>
{% endblock %}
{% block content %}

<section style="margin-top: 2rem; margin-bottom: 1rem;" class="vh-100" style="background-color: #eee;">
    <div class="container h-1">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-lg-12 col-xl-11">
          <div class="card text-black" style="border-radius: 25px; align-self: center; background-color:beige;">
            <div class="card-body p-md-5">
              <div class="row justify-content-center">
                <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">
  
                  <p class="text-center h1 fw-bold mb-5 mx-1 mx-md-4 mt-4">Register</p>
                  
                  {%if error%}
                  <div class="alert alert-danger" role="alert">
                    {{error}}
                  </div>
                  {%endif%}
                  

                  <form class="mx-1 mx-md-4" action="." method="POST">
                    {% csrf_token %}

                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-user fa-lg me-3 fa-fw"></i>
                      <div class="form-outline flex-fill mb-0">
                        <input required type="text" id="form3Example1c" class="form-control" style="background-color: #ffffff;" Name='csid' value="{{values.csid}}" />
                        <label class="form-label" for="form3Example1c">Staff ID</label>
                      </div>
                    </div>
  
                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-envelope fa-lg me-3 fa-fw"></i>
                      <div class="form-outline flex-fill mb-0">
                        <input required type="email" id="form3Example3c" class="form-control" style="background-color: #ffffff;" Name='email' value="{{values.email}}" />
                        <label class="form-label" for="form3Example3c">Email</label>
                      </div>
                    </div>
                    
                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-lock fa-lg me-3 fa-fw"></i>
                      <div class="form-outline flex-fill mb-0" data-mdb-input-init>
                        <i class="far fa-eye trailing fa-fw pe-auto" id="show-password-toggle-icon"></i>
                        <input required type="password" id="show-password-input-1" class="form-control form-icon-trailing" style="background-color: #ffffff;" Name='password' />
                        <label class="form-label" for="show-password-input-1">Password</label>
                      </div>
                    </div>
  
                    <div class="d-flex flex-row align-items-center mb-4">
                      <i class="fas fa-key fa-lg me-3 fa-fw"></i>
                      <div class="form-outline flex-fill mb-0" data-mdb-input-init>
                        <i class="far fa-eye trailing fa-fw pe-auto" id="show-repassword-toggle-icon"></i>
                        <input required type="password" id="show-password-input-2" class="form-control form-icon-trailing" style="background-color: #ffffff;" Name='repassword' />
                        <label class="form-label" for="show-password-input-2">Repeat your password</label>
                      </div>
                    </div>
  
  
                    <div class="d-flex justify-content-center mx-4 mb-3 mb-lg-4">
                      <button type="submit" class="btn btn-primary btn-lg">Register</button>
                    </div>
  
                  </form>
  
                </div>
                <div class="col-md-10 col-lg-6 col-xl-7 d-flex align-items-center order-1 order-lg-2">
  
                  <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/draw1.webp"
                    class="img-fluid" alt="Sample image" style="border-radius: 50px;">
  
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
</section>




{% endblock %}
